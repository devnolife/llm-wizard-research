# Optional services only. The backend itself is not containerised (no Dockerfile);
# run it with `make backend` (see README Quick Start).
#
#   docker compose --profile grobid up -d grobid   # PDF metadata + IMRaD sections
#   docker compose --profile neo4j  up -d neo4j    # external knowledge-graph store

services:
  # Neo4j Knowledge Graph (Optional)
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5.14
    container_name: neo4j-graph
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/research123}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  # GROBID — high-quality PDF metadata + IMRaD structure (TAHAP 1, optional).
  # Then set GROBID_URL=http://localhost:8070 for the backend.
  grobid:
    profiles: ["grobid"]
    image: lfoppiano/grobid:0.8.1
    container_name: grobid
    ports:
      - "8070:8070"
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
